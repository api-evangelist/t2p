name: T2P
description: >-
  T2P Co., Ltd. (DeepPocket) is a Bangkok, Thailand fintech founded in 2011 that
  provides comprehensive payment solutions for enterprises of all sizes. Its
  products include a payment gateway (cards, mobile wallets, in-store), a
  white-label digital wallet platform, corporate and prepaid card issuance,
  spend management with real-time controls, business escrow, the DeepBlok
  loyalty program, and the DeepPocket consumer e-wallet app for top-ups,
  payments, and global money transfers. T2P is backed by 500 Global, Benchachinda
  Holding, DTAC Accelerate, and J Ventures, and reports serving 10M+ customers
  and 30+ corporate clients. T2P holds PCI DSS compliance but publishes no public
  developer API surface; integrations are arranged directly with the company.
